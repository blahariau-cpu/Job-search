<script>
/* ---------------------------------------------------------------
   Local-first storage compatibility layer.
   Works when this HTML is opened directly from disk (file://).
   Uses localStorage when available and falls back to an in-memory
   store for restricted browser contexts.
---------------------------------------------------------------- */
(function () {
  const memoryStore = Object.create(null);
  function safeLocalStorage() {
    try {
      const k = "__calibrate_local_storage_test__";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      return localStorage;
    } catch (e) {
      return null;
    }
  }
  const ls = safeLocalStorage();
  window.storage = {
    async get(key) {
      const value = ls ? ls.getItem(key) : memoryStore[key];
      return value == null ? null : { key: key, value: value };
    },
    async set(key, value) {
      if (ls) ls.setItem(key, String(value));
      else memoryStore[key] = String(value);
      return { key: key, value: String(value) };
    },
    async delete(key) {
      if (ls) ls.removeItem(key);
      else delete memoryStore[key];
      return true;
    }
  };
})();
</script>
<script>
/* ---------------------------------------------------------------
   Minimal ZIP writer (stored/no-compression) for offline bundles.
   Keeps the app independent of CDN-hosted JSZip.
---------------------------------------------------------------- */
window.makeOfflineZip = makeOfflineZip;
function makeOfflineZip(files) {
  function u16(n) {
    return new Uint8Array([n & 255, (n >>> 8) & 255]);
  }
  function u32(n) {
    return new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]);
  }
  function concat(parts) {
    const total = parts.reduce((n, p) => n + p.length, 0);
    const out = new Uint8Array(total);
    let off = 0;
    parts.forEach(p => { out.set(p, off); off += p.length; });
    return out;
  }
  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) {
      c ^= bytes[i];
      for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xedb88320 & -(c & 1));
    }
    return (c ^ 0xffffffff) >>> 0;
  }
  const enc = new TextEncoder();
  const local = [];
  const central = [];
  let offset = 0;

  files.forEach(file => {
    const name = enc.encode(file.name);
    const data = file.data instanceof Uint8Array ? file.data : enc.encode(String(file.data));
    const crc = crc32(data);
    const localHeader = concat([
      new Uint8Array([0x50,0x4b,0x03,0x04]),
      u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length),
      u16(name.length), u16(0), name
    ]);
    local.push(localHeader, data);

    const centralHeader = concat([
      new Uint8Array([0x50,0x4b,0x01,0x02]),
      u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length),
      u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset), name
    ]);
    central.push(centralHeader);
    offset += localHeader.length + data.length;
  });

  const centralBytes = concat(central);
  const localBytes = concat(local);
  const end = concat([
    new Uint8Array([0x50,0x4b,0x05,0x06]),
    u16(0), u16(0), u16(files.length), u16(files.length),
    u32(centralBytes.length), u32(localBytes.length), u16(0)
  ]);
  return new Blob([localBytes, centralBytes, end], {type:"application/zip"});
}


/* ---------------------------------------------------------------
   Exact DOCX template preservation engine.
   The uploaded .docx is unpacked locally, only text nodes are
   replaced, and all original Word XML/styles/media/layout are kept.
---------------------------------------------------------------- */
const TEMPLATE_DB_NAME = "calibrate2-template-files-v1";
const TEMPLATE_DB_STORE = "files";

function openTemplateDB() {
  return new Promise(function(resolve, reject) {
    if (!window.indexedDB) { reject(new Error("IndexedDB is unavailable.")); return; }
    const req = indexedDB.open(TEMPLATE_DB_NAME, 1);
    req.onupgradeneeded = function() {
      const db = req.result;
      if (!db.objectStoreNames.contains(TEMPLATE_DB_STORE)) db.createObjectStore(TEMPLATE_DB_STORE);
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error("Could not open local template storage.")); };
  });
}
async function putTemplateBytes(id, bytes) {
  const db = await openTemplateDB();
  return new Promise(function(resolve, reject) {
    const tx = db.transaction(TEMPLATE_DB_STORE, "readwrite");
    tx.objectStore(TEMPLATE_DB_STORE).put(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength), id);
    tx.oncomplete = function(){ db.close(); resolve(); };
    tx.onerror = function(){ const e = tx.error; db.close(); reject(e || new Error("Could not save template bytes.")); };
  });
}
async function getTemplateBytes(id) {
  if (!id) return null;
  const db = await openTemplateDB();
  return new Promise(function(resolve, reject) {
    const tx = db.transaction(TEMPLATE_DB_STORE, "readonly");
    const req = tx.objectStore(TEMPLATE_DB_STORE).get(id);
    req.onsuccess = function() {
      const v = req.result;
      db.close();
      resolve(v ? new Uint8Array(v) : null);
    };
    req.onerror = function(){ const e=req.error; db.close(); reject(e || new Error("Could not load template bytes.")); };
  });
}
async function deleteTemplateBytes(id) {
  if (!id || !window.indexedDB) return;
  try {
    const db = await openTemplateDB();
    await new Promise(function(resolve, reject) {
      const tx = db.transaction(TEMPLATE_DB_STORE, "readwrite");
      tx.objectStore(TEMPLATE_DB_STORE).delete(id);
      tx.oncomplete = function(){ db.close(); resolve(); };
      tx.onerror = function(){ const e=tx.error; db.close(); reject(e); };
    });
  } catch(e) {}
}

function zipU16(b, o){ return b[o] | (b[o+1] << 8); }
function zipU32(b, o){ return (b[o] | (b[o+1] << 8) | (b[o+2] << 16) | (b[o+3] << 24)) >>> 0; }

async function inflateRawBytes(bytes) {
  if (typeof DecompressionStream === "undefined") {
    throw new Error("This browser cannot open compressed DOCX templates. Use a current Chrome or Edge browser.");
  }
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function readZipEntries(inputBytes) {
  const b = inputBytes instanceof Uint8Array ? inputBytes : new Uint8Array(inputBytes);
  let eocd = -1;
  const min = Math.max(0, b.length - 65557);
  for (let i = b.length - 22; i >= min; i--) {
    if (zipU32(b, i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("This file is not a valid .docx ZIP package.");

  const count = zipU16(b, eocd + 10);
  let p = zipU32(b, eocd + 16);
  const dec = new TextDecoder("utf-8");
  const entries = [];

  for (let n = 0; n < count; n++) {
    if (zipU32(b, p) !== 0x02014b50) throw new Error("The DOCX central directory is damaged.");
    const flags = zipU16(b, p + 8);
    const method = zipU16(b, p + 10);
    const compSize = zipU32(b, p + 20);
    const uncompSize = zipU32(b, p + 24);
    const nameLen = zipU16(b, p + 28);
    const extraLen = zipU16(b, p + 30);
    const commentLen = zipU16(b, p + 32);
    const localOffset = zipU32(b, p + 42);
    const name = dec.decode(b.slice(p + 46, p + 46 + nameLen));

    if (flags & 1) throw new Error("Encrypted DOCX templates are not supported.");
    if (zipU32(b, localOffset) !== 0x04034b50) throw new Error("A DOCX file entry is damaged.");
    const localNameLen = zipU16(b, localOffset + 26);
    const localExtraLen = zipU16(b, localOffset + 28);
    const dataStart = localOffset + 30 + localNameLen + localExtraLen;
    const comp = b.slice(dataStart, dataStart + compSize);

    let data;
    if (method === 0) data = comp;
    else if (method === 8) data = await inflateRawBytes(comp);
    else throw new Error("Unsupported DOCX compression method: " + method);

    if (uncompSize && data.length !== uncompSize) {
      throw new Error("A DOCX file entry could not be decompressed correctly.");
    }
    entries.push({ name: name, data: data });
    p += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

function getZipEntry(entries, name) {
  return entries.find(function(e){ return e.name === name; }) || null;
}

function paragraphTextNodes(doc) {
  const all = Array.from(doc.getElementsByTagNameNS("*", "p"));
  return all.map(function(p) {
    return {
      p: p,
      nodes: Array.from(p.getElementsByTagNameNS("*", "t"))
    };
  }).filter(function(x){ return x.nodes.length; });
}

function replaceAcrossTextNodes(nodes, search, replacement) {
  if (!search) return 0;
  let count = 0;
  while (true) {
    const texts = nodes.map(function(n){ return n.textContent || ""; });
    const full = texts.join("");
    const at = full.indexOf(search);
    if (at < 0) break;

    let cursor = 0, startNode = -1, endNode = -1, startOff = 0, endOff = 0;
    for (let i = 0; i < texts.length; i++) {
      const next = cursor + texts[i].length;
      if (startNode < 0 && at >= cursor && at < next) {
        startNode = i; startOff = at - cursor;
      }
      const endPos = at + search.length;
      if (endPos > cursor && endPos <= next) {
        endNode = i; endOff = endPos - cursor; break;
      }
      cursor = next;
    }
    if (startNode < 0) break;
    if (endNode < 0) { endNode = texts.length - 1; endOff = texts[endNode].length; }

    const before = texts[startNode].slice(0, startOff);
    const after = texts[endNode].slice(endOff);
    if (startNode === endNode) {
      nodes[startNode].textContent = before + replacement + after;
    } else {
      nodes[startNode].textContent = before + replacement;
      for (let j = startNode + 1; j < endNode; j++) nodes[j].textContent = "";
      nodes[endNode].textContent = after;
    }
    count++;
  }
  return count;
}

function replaceDocxXmlText(xml, pairs) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xml, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("Word XML could not be read.");

  let replaced = 0;
  const paras = paragraphTextNodes(doc);
  pairs.forEach(function(pair) {
    const search = pair[0], replacement = pair[1];
    if (!search || replacement == null) return;
    if (String(search) === String(replacement)) return;
    paras.forEach(function(info) {
      replaced += replaceAcrossTextNodes(info.nodes, String(search), String(replacement));
    });
  });
  return { xml: new XMLSerializer().serializeToString(doc), replaced: replaced };
}

function tailoredSkillLine(rec) {
  const base = (RESUME.skills || "").split(/·|,|\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  const extra = (rec.confirmedSkills || []).concat((state.confirmedSkills || []));
  return uniqueCI(base.concat(extra)).join(" · ");
}

function templateReplacementPairs(rec) {
  const pairs = [];
  const edits = {};
  (rec.bulletEdits || []).forEach(function(e){ edits[e.id] = e.text; });

  function add(token, value) { pairs.push([token, value == null ? "" : String(value)]); }

  // Explicit placeholders. These are optional.
  add("{{NAME}}", RESUME.name);
  add("{{TITLE}}", RESUME.title);
  add("{{LOCATION}}", RESUME.location);
  add("{{CONTACT}}", RESUME.contact);
  add("{{SUMMARY}}", rec.tailoredSummary || RESUME.summary);
  add("{{SKILLS}}", tailoredSkillLine(rec));
  add("{{WORK_RIGHTS}}", RESUME.workRights || "");

  (RESUME.careerHighlights || []).forEach(function(v, i){ add("{{CAREER_HIGHLIGHT_" + (i+1) + "}}", v); });
  (RESUME.competencies || []).forEach(function(v, i){ add("{{COMPETENCY_" + (i+1) + "}}", v); });
  (RESUME.certifications || []).forEach(function(v, i){ add("{{CERTIFICATION_" + (i+1) + "}}", v); });
  (RESUME.additionalInfo || []).forEach(function(v, i){ add("{{ADDITIONAL_" + (i+1) + "}}", v); });

  (RESUME.education || []).forEach(function(e, i) {
    const n=i+1;
    add("{{EDUCATION_" + n + "_DEGREE}}", e.degree || "");
    add("{{EDUCATION_" + n + "_SCHOOL}}", e.school || "");
    add("{{EDUCATION_" + n + "_GPA}}", e.gpa || "");
    add("{{EDUCATION_" + n + "_DATES}}", e.dates || "");
  });

  (RESUME.experience || []).forEach(function(exp, i) {
    const n=i+1;
    add("{{EXP_" + n + "_ROLE}}", exp.role || "");
    add("{{EXP_" + n + "_ORG}}", exp.org || "");
    add("{{EXP_" + n + "_DATES}}", exp.dates || "");
    add("{{EXP_" + n + "_TAGLINE}}", exp.tagline || "");
    (exp.bullets || []).forEach(function(b, bi) {
      add("{{EXP_" + n + "_BULLET_" + (bi+1) + "}}", edits[b.id] || b.text);
      add("{{BULLET_" + b.id + "}}", edits[b.id] || b.text);
    });
  });

  // Automatic replacement when the template already contains the
  // current Master Resume text. This allows existing resume DOCX files
  // to work without adding placeholders.
  if (RESUME.summary) add(RESUME.summary, rec.tailoredSummary || RESUME.summary);
  if (RESUME.skills) add(RESUME.skills, tailoredSkillLine(rec));
  (RESUME.experience || []).forEach(function(exp) {
    (exp.bullets || []).forEach(function(b) {
      if (edits[b.id] && edits[b.id] !== b.text) add(b.text, edits[b.id]);
    });
  });

  // Longer source strings first prevents a short token replacing text
  // that belongs to a more specific replacement.
  return pairs.sort(function(a,b){ return String(b[0]).length - String(a[0]).length; });
}

async function inspectDocxTemplate(bytes) {
  const entries = await readZipEntries(bytes);
  const main = getZipEntry(entries, "word/document.xml");
  if (!main) throw new Error("This .docx does not contain word/document.xml.");
  const xml = new TextDecoder("utf-8").decode(main.data);
  const parsed = new DOMParser().parseFromString(xml, "application/xml");
  const visible = paragraphTextNodes(parsed).map(function(info){
    return info.nodes.map(function(n){ return n.textContent || ""; }).join("");
  }).join("\n");
  const placeholderCount = (visible.match(/\{\{[A-Z0-9_]+\}\}/g) || []).length;
  let sourceMatches = 0;
  if (RESUME.summary && visible.indexOf(RESUME.summary.slice(0, 80)) >= 0) sourceMatches++;
  (RESUME.experience || []).forEach(function(exp){
    (exp.bullets || []).forEach(function(b){
      if (b.text && visible.indexOf(b.text.slice(0, Math.min(70, b.text.length))) >= 0) sourceMatches++;
    });
  });
  return { placeholderCount: placeholderCount, sourceMatches: sourceMatches };
}

async function buildResumeFromMasterTemplate(rec) {
  const t = getTemplateProfile();
  if (!t || !t.id || !t.sourceFileName || !/\.docx$/i.test(t.sourceFileName)) {
    throw new Error("Upload and remember a .docx Master Template first. Exact format preservation requires .docx.");
  }
  const bytes = await getTemplateBytes(t.id);
  if (!bytes) throw new Error("The saved Master Template file data is missing. Re-upload the .docx template once.");

  const entries = await readZipEntries(bytes);
  const pairs = templateReplacementPairs(rec);
  const enc = new TextEncoder(), dec = new TextDecoder("utf-8");
  let total = 0;

  for (let i = 0; i < entries.length; i++) {
    if (/^word\/(?:document|header\d*|footer\d*)\.xml$/i.test(entries[i].name)) {
      const result = replaceDocxXmlText(dec.decode(entries[i].data), pairs);
      entries[i].data = enc.encode(result.xml);
      total += result.replaced;
    }
  }

  if (!total) {
    throw new Error("No replaceable resume content was found in this template. Use your existing Master Resume DOCX, or add placeholders such as {{SUMMARY}} and {{EXP_1_BULLET_1}} to the template.");
  }

  return {
    blob: makeOfflineZip(entries),
    replacements: total
  };
}

/* ---------------------------------------------------------------
   Live score recalculation — checking off a "gap" keyword as
   actually covered nudges both scores toward 100, proportional to
   how much of the gap list has been confirmed. Purely a client-side
   estimate layered on top of the model's baseline scores.
---------------------------------------------------------------- */
function adjustedScore(base, totalGaps, confirmedCount, strength) {
  if (base == null) return base;
  if (!totalGaps) return base;
  const recovered = ((100 - base) * confirmedCount) / totalGaps * strength;
  return Math.max(0, Math.min(100, Math.round(base + recovered)));
}
function adjustedAts(r) {
  if (!r) return null;
  return adjustedScore(r.atsScore, (r.missingKeywords || []).length, state.confirmedGaps.length, 1.0);
}
function adjustedProb(r) {
  if (!r) return null;
  return adjustedScore(r.selectionProbability, (r.missingKeywords || []).length, state.confirmedGaps.length, 0.6);
}
function toggleGap(keyword) {
  const i = state.confirmedGaps.indexOf(keyword);
  if (i === -1) state.confirmedGaps.push(keyword); else state.confirmedGaps.splice(i, 1);

}

function cleanIntelValue(v) { return String(v || "").replace(/\s+/g, " ").trim(); }
function uniqueCI(arr) {

  return (arr || []).map(cleanIntelValue).filter(Boolean).filter(function(v){
    const k=v.toLowerCase(); if(seen[k]) return false; seen[k]=1; return true;
  });
}

function extractSalaryPatterns(text) {

  const rx=/(?:AUD\s*)?\$\s?\d{2,3}(?:,\d{3})?(?:\s*[kK])?(?:\s*(?:-|–|—|to)\s*(?:AUD\s*)?\$?\s?\d{2,3}(?:,\d{3})?(?:\s*[kK])?)?(?:\s*(?:per\s+year|p\.?a\.?|pa|annual(?:ly)?|base))?|\b\d{2,3}\s*[kK]\s*(?:-|–|—|to)\s*\d{2,3}\s*[kK]\b/g;

/* ---------------------------------------------------------------

function linesOf(text) {

function resumeToDraft(r) {
  return {

    experience: (r.experience || []).map(function (exp) {
      return {
        role: exp.role || "", org: exp.org || "", dates: exp.dates || "", tagline: exp.tagline || "",
        bulletsText: (exp.bullets || []).map(function (b) { return b.text; }).join("\n"),
        _ids: (exp.bullets || []).map(function (b) { return b.id; }),
      };
    }),
    educationText: (r.education || []).map(function (e) { return [e.degree, e.school, e.gpa, e.dates].join(" | "); }).join("\n"),
    certificationsText: (r.certifications || []).join("\n"),
    workRightsText: r.workRights || "",
    additionalInfoText: (r.additionalInfo || []).join("\n"),
  };
}
function draftToResume(d) {
  return {
    name: d.name || "", title: d.title || "", location: d.location || "", contact: d.contact || "",
    photo: d.photo || "",
    summary: d.summaryText || "",
    careerHighlights: linesOf(d.careerHighlightsText),
    competencies: linesOf(d.competenciesText),
    experience: (d.experience || []).map(function (exp, i) {
      const ids = exp._ids || [];
      return {
        role: exp.role || "", org: exp.org || "", dates: exp.dates || "", tagline: exp.tagline || "",
        bullets: linesOf(exp.bulletsText).map(function (text, bi) {
          return { id: ids[bi] || ("b" + Date.now().toString(36) + i + bi), text: text };
        }),
      };
    }),
    skills: d.skillsText || "",
    education: linesOf(d.educationText).map(function (line) {
      const parts = line.split("|").map(function (s) { return s.trim(); });
      return { degree: parts[0] || "", school: parts[1] || "", gpa: parts[2] || "", dates: parts[3] || "" };
    }),
    certifications: linesOf(d.certificationsText),
    workRights: d.workRightsText || "",
    additionalInfo: linesOf(d.additionalInfoText),
  };

function parseJobPosting(text) {
  const src = String(text || "").replace(/\r/g, "");
  const lines = src.split("\n").map(function(x){ return x.replace(/\s+/g," ").trim(); }).filter(Boolean);
  const lower = src.toLowerCase();
  function firstMatch(regexes) {
    for (let i=0;i<regexes.length;i++) { const m=src.match(regexes[i]); if(m && m[1]) return cleanIntelValue(m[1]).slice(0,140); }
    return "";
  }
  function looksLikeNoise(line) {
    return /^(apply|save|share|about the job|job description|description|overview|responsibilities|requirements|qualifications|benefits|who you are|what you(?:'|’)ll do|about us)$/i.test(line) ||
      /^(posted|advertised|job id|reference|ref|requisition|date|full[- ]?time|part[- ]?time|contract|permanent|hybrid|remote)$/i.test(line);
  }
  function looksLikeTitle(line) {
    if (!line || line.length < 3 || line.length > 110 || looksLikeNoise(line)) return false;
    const roleWords = /(manager|engineer|analyst|specialist|consultant|coordinator|director|lead|head|officer|advisor|developer|scientist|architect|planner|supervisor|administrator|designer|technician|associate|executive|controller|estimator|scheduler|scrum master|product owner|project|program|programme)/i;
    const bad = /(salary|location|benefit|responsibilit|qualification|experience required|about|company|organisation|organization|team)/i;
    return roleWords.test(line) && !bad.test(line) && line.split(/\s+/).length <= 12;
  }
  function looksLikeLocation(line) {
    if (!line || line.length > 100) return false;
    return /\b(?:VIC|Victoria|NSW|New South Wales|QLD|Queensland|WA|Western Australia|SA|South Australia|TAS|Tasmania|ACT|NT|Melbourne|Sydney|Brisbane|Perth|Adelaide|Canberra|Hobart|Darwin|Geelong|Gold Coast|Newcastle|Australia|remote|hybrid)\b/i.test(line) && !/\b(?:experience|team|project|company|role|responsibilit)\b/i.test(line);
  }
  let jobTitle = firstMatch([
    /(?:job\s*title|position\s*title|role\s*title|role|position)\s*[:\-–—]\s*([^\n]+)/i,
    /(?:we(?:'|’)re hiring|hiring for|seeking an?|looking for an?)\s+([^\n.!]{3,100})/i
  ]);
  if (!jobTitle) jobTitle = lines.find(looksLikeTitle) || "";

  let company = firstMatch([
    /(?:company|organisation|organization|employer)\s*[:\-–—]\s*([^\n]+)/i,
    /(?:join|at|with)\s+([A-Z][A-Za-z0-9&.'’\- ]{2,70})\s+(?:as|is seeking|is looking|we are|team)/,
    /(?:about|why join)\s+([A-Z][A-Za-z0-9&.'’\- ]{2,70})\s*(?:\n|$)/
  ]);
  if (!company) {
    const ti = jobTitle ? lines.indexOf(jobTitle) : -1;
    const nearby = ti >= 0 ? lines.slice(Math.max(0,ti-3), Math.min(lines.length,ti+4)) : lines.slice(0,8);
    company = nearby.find(function(line){
      return line !== jobTitle && line.length >= 2 && line.length <= 70 && !looksLikeNoise(line) && !looksLikeLocation(line) &&
        !looksLikeTitle(line) && !/[.!?]$/.test(line) && !/\b(?:salary|job|role|position|apply|remote|hybrid|full time|part time)\b/i.test(line);
    }) || "";
  }

  let location = firstMatch([
    /(?:location|work location|based in|based at)\s*[:\-–—]\s*([^\n]+)/i,
    /\b((?:Melbourne|Sydney|Brisbane|Perth|Adelaide|Canberra|Hobart|Darwin|Geelong|Gold Coast|Newcastle)(?:\s*,?\s*(?:VIC|Victoria|NSW|QLD|WA|SA|TAS|ACT|NT|Australia))?)\b/i
  ]);
  if (!location) location = lines.find(looksLikeLocation) || "";

  const contactInfo = firstMatch([/(?:contact|recruiter|hiring manager)\s*[:\-–—]\s*([^\n]+)/i,/([A-Z][A-Za-z .'-]+\s*[-–—|]\s*[\w.+-]+@[\w.-]+\.[A-Za-z]{2,})/]);

  const skillLexicon = [
    'Agile','Scrum','Kanban','Waterfall','Jira','Confluence','MS Project','Microsoft Project','Primavera P6','Power BI','Tableau','Excel','SQL','Python','R','MATLAB','AutoCAD','SolidWorks','SAP','Oracle','Salesforce','Azure','AWS','GCP','Git','GitHub','DevOps','CI/CD','Lean','Six Sigma','PRINCE2','PMP','PMO','Risk Management','Stakeholder Management','Change Management','Project Management','Program Management','Portfolio Management','Cost Control','Budgeting','Forecasting','Scheduling','Planning','Procurement','Contract Management','Vendor Management','Quality Assurance','Quality Management','Root Cause Analysis','FMEA','DFMEA','PFMEA','APQP','PPAP','ISO 9001','ISO 14001','ISO 45001','Systems Engineering','Requirements Management','Data Analysis','Data Analytics','Reporting','Dashboarding','Process Improvement','Continuous Improvement','Business Analysis','Technical Writing','Leadership','People Management','Mentoring','Coaching','Communication','Negotiation','Problem Solving','Mechanical Engineering','Electrical Engineering','Manufacturing','Automotive','Aerospace','Construction','Mining','Energy','Rail','Defence','Telecommunications'
  ];
  const foundSkills = skillLexicon.filter(function(skill){
    const escRx=skill.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
    return new RegExp('(^|[^a-z0-9])'+escRx+'([^a-z0-9]|$)','i').test(src);
  });

  const headingSkillRx = /(?:key skills|skills|technical skills|capabilities|competencies|what you(?:'|’)ll bring|requirements|qualifications)\s*[:\-]?\s*\n([\s\S]{0,1800}?)(?=\n\s*(?:responsibilities|about|benefits|why|what you(?:'|’)ll do|the role|how to apply|$))/i;
  const skillSection = (src.match(headingSkillRx)||[])[1] || "";
  const bulletCandidates = skillSection.split(/\n|[•·;]|\s+-\s+/).map(function(x){return cleanIntelValue(x);}).filter(function(x){return x.length>=2 && x.length<=90;});
  const contextualSkills = bulletCandidates.filter(function(x){
    return !/^(you|we|the|this|our|your)\b/i.test(x) && !/[.!?].*[.!?]/.test(x) && x.split(/\s+/).length <= 10;
  }).slice(0,20);

  const seniority = (src.match(/\b(?:graduate|junior|mid(?:-level)?|senior|lead|principal|staff|manager|director|head of|executive)\b/i)||[])[0] || "";
  const employmentType = (src.match(/\b(?:full[- ]time|part[- ]time|contract(?:or)?|permanent|temporary|casual|fixed[- ]term)\b/i)||[])[0] || "";
  return {
    company: cleanIntelValue(company), jobTitle: cleanIntelValue(jobTitle), location: cleanIntelValue(location), contactInfo: cleanIntelValue(contactInfo),
    skills: uniqueCI(foundSkills.concat(contextualSkills)).slice(0,30), salaries: extractSalaryPatterns(src), seniority: cleanIntelValue(seniority), employmentType: cleanIntelValue(employmentType)
  };
}


function safeJsonFromClaude(text) {
  let raw = String(text || "").trim();
  raw = raw.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
  try { return JSON.parse(raw); } catch (e) {}
  const first = raw.indexOf("{"), last = raw.lastIndexOf("}");
  if (first >= 0 && last > first) return JSON.parse(raw.slice(first, last + 1));
  throw new Error("Claude did not return valid JSON.");
}

function sanitizeClaudeResult(ai, localBase) {
  ai = ai && typeof ai === "object" ? ai : {};
  const validIds = {};
  getAllBullets().forEach(function(b){ validIds[b.id] = true; });

  const edits = Array.isArray(ai.bulletEdits) ? ai.bulletEdits.filter(function(e){
    return e && validIds[e.id] && typeof e.text === "string" && e.text.trim();
  }).slice(0, 8).map(function(e){
    return { id: e.id, text: e.text.trim().slice(0, 700) };
  }) : [];

  const extracted = Object.assign({}, localBase.extracted || {}, ai.extracted || {});
  extracted.keySkills = Array.isArray(extracted.keySkills) ? extracted.keySkills.slice(0, 24) : (localBase.extracted.keySkills || []);
  extracted.salaries = Array.isArray(extracted.salaries) ? extracted.salaries.slice(0, 12) : (localBase.extracted.salaries || []);

  return Object.assign({}, localBase, {
    extracted: extracted,
    tailoredSummary: typeof ai.tailoredSummary === "string" && ai.tailoredSummary.trim() ? ai.tailoredSummary.trim() : localBase.tailoredSummary,
    bulletEdits: edits.length ? edits : localBase.bulletEdits,
    coverLetter: typeof ai.coverLetter === "string" && ai.coverLetter.trim() ? ai.coverLetter.trim() : localBase.coverLetter,
    recommendations: Array.isArray(ai.recommendations) && ai.recommendations.length ? ai.recommendations.slice(0, 6) : localBase.recommendations,
    matchedKeywords: Array.isArray(ai.matchedKeywords) ? uniqueCI(ai.matchedKeywords).slice(0, 14) : localBase.matchedKeywords,

async function calibrate(rawInput, useResearch) {
  // Local-first analysis. This deliberately avoids calling an AI API from a
  // file:// page, which is unreliable because browser CORS/authentication
  // blocks direct model API calls. The candidate profile is cached locally.
  const stop = new Set("the a an and or but if then than to of in on for with from by as at is are was were be been being this that these those it its you your our we they their role job position candidate experience experienced work working team teams skills skill ability including using use used strong excellent good will required preferred must should plus about into across within through supporting support manage management manager engineering engineer project projects".split(/\s+/));
  function norm(x){ return String(x||"").toLowerCase().replace(/[^a-z0-9+#./-]+/g," ").trim(); }
  function tokens(x){ return norm(x).split(/\s+/).filter(function(w){ return w.length>2 && !stop.has(w) && !/^\d+$/.test(w); }); }
  function counts(x){ const m={}; tokens(x).forEach(function(w){ m[w]=(m[w]||0)+1; }); return m; }
  function unique(arr){ return Array.from(new Set(arr.filter(Boolean))); }
  function titleCase(x){ return x.replace(/\b\w/g,function(c){return c.toUpperCase();}); }
  const parsed = parseJobPosting(rawInput);
  let company = parsed.company;
  let jobTitle = parsed.jobTitle;
  let location = parsed.location;
  let contactInfo = parsed.contactInfo;
  const pi = ensureProfileIntel();
  const resumeText = JSON.stringify(RESUME) + " " + (pi.keywords||[]).join(" ") + " " + (pi.skills||[]).join(" ");
  const rc = counts(resumeText), jc = counts(rawInput);
  const ignoredGapSet = {}; (pi.notGaps||[]).forEach(function(x){ignoredGapSet[norm(x)]=true;});
  const parsedSkillTokens = tokens((parsed.skills || []).join(" "));
  const ranked = unique(parsedSkillTokens.concat(Object.keys(jc).sort(function(a,b){ return jc[b]-jc[a] || b.length-a.length; })));
  const matched = [], missing=[];
  ranked.forEach(function(k){
    if (matched.length>=8 && missing.length>=8) return;
    if (rc[k]) { if(matched.length<8) matched.push(k); }
    else if (!ignoredGapSet[norm(k)] && missing.length<8) missing.push(k);
  });
  const allBullets = getAllBullets();
  const jobSet = new Set(tokens(rawInput));
  const scored = allBullets.map(function(b){
    const bt=unique(tokens(b.text)); let score=0; bt.forEach(function(w){ if(jobSet.has(w)) score++; });
    return {b:b, score:score};
  }).sort(function(a,b){return b.score-a.score;});
  const bulletEdits = scored.slice(0,4).filter(function(x){return x.score>0;}).map(function(x){ return {id:x.b.id,text:x.b.text}; });
  const resumeOnly = counts(JSON.stringify(RESUME));
  const skillSuggestions = unique(ranked.filter(function(k){ return resumeOnly[k] && norm(RESUME.skills).indexOf(k)<0; })).slice(0,5).map(titleCase);
  addIntel("keywords", matched.map(titleCase));
  if (jobTitle) addIntel("jobTitles", jobTitle);
  if (company) addIntel("companies", company);
  if (location) addIntel("locations", location);
  addIntel("salaries", parsed.salaries || extractSalaryPatterns(rawInput));
  await persistProfileIntel();
  const ats = Math.max(20, Math.min(96, Math.round((matched.length / Math.max(1, matched.length + Math.min(8,missing.length))) * 100)));
  const prob = Math.max(15, Math.min(90, Math.round(ats*0.72 + Math.min(18, bulletEdits.length*4))));
  const strengths = matched.slice(0,4).map(titleCase);
  const tailoredSummary = strengths.length
    ? "Engineering and project professional with demonstrated experience in " + strengths.join(", ") + ". Brings evidence-based delivery, cross-functional coordination and technical problem-solving grounded in the master resume."
    : RESUME.summary;
  const addressee = "Hiring Manager";
  const roleName = jobTitle || "this opportunity";
  const companyName = company || "your organisation";
  const coverLetter = "Dear " + addressee + ",\n\nI am applying for " + roleName + " at " + companyName + ". My background aligns through " + (strengths.length ? strengths.slice(0,3).join(", ") : "engineering delivery, project coordination and data-driven problem solving") + ", supported by the experience documented in my resume.\n\nI would welcome the opportunity to discuss how this experience can support the role's priorities. Thank you for your consideration.";
  return {
    extracted:{company:company,jobTitle:jobTitle,location:location,contactInfo:contactInfo,seniority:parsed.seniority,employmentType:parsed.employmentType,keySkills:parsed.skills,salaries:parsed.salaries},
    companyResearchUsed:false, atsScore:ats, selectionProbability:prob,
    matchedKeywords:unique((parsed.skills || []).filter(function(sk){ return norm(resumeText).indexOf(norm(sk)) !== -1; }).concat(matched.map(titleCase))).slice(0,10), missingKeywords:unique((parsed.skills || []).filter(function(sk){ return norm(resumeText).indexOf(norm(sk)) === -1 && !ignoredGapSet[norm(sk)]; }).concat(missing.map(titleCase))).slice(0,10),
    tailoredSummary:tailoredSummary, bulletEdits:bulletEdits, skillsToAdd:skillSuggestions,
    recommendations:["Confirm only skills you genuinely have before adding them.","Prioritise bullets that share the job's strongest keywords.","Keep the master profile updated so future runs need less analysis."],
    coverLetter:coverLetter,
    tip:"This run used the stored profile first, so it is faster and works offline. Update confirmed skills in the master profile to improve future matching.",
    notes: missing.length ? "Potential gaps detected from the posting; only add them if you genuinely have that experience." : ""
  };
}

/* ---------------------------------------------------------------
   Job link fetch — best effort, three tiers, falls back to a
   manual paste since most boards block this from a browser.
---------------------------------------------------------------- */
async function fetchJobFromUrl(url) {
  const res = await fetch(url, { mode: "cors" });
  if (!res.ok) throw new Error("bad status");
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, "text/html");

  // Tier 1: schema.org JobPosting structured data — most reliable when present.
  const scripts = Array.from(doc.querySelectorAll('script[type="application/ld+json"]'));
  for (const s of scripts) {
    try {
      const parsed = JSON.parse(s.textContent);
      const candidates = Array.isArray(parsed) ? parsed : [parsed];
      const jp = candidates.find(function (c) {
        return c && (c["@type"] === "JobPosting" || (Array.isArray(c["@type"]) && c["@type"].includes("JobPosting")));
      });
      if (jp) {
        const tmp = document.createElement("div");
        tmp.innerHTML = jp.description || "";
        const description = (tmp.textContent || "").replace(/\s+/g, " ").trim();
        if (description.length > 100) {
          return {
            description: description.slice(0, 8000),
            title: jp.title || "",
            company: (jp.hiringOrganization && jp.hiringOrganization.name) || "",
          };
        }
      }
    } catch (e) { /* not usable JSON-LD, keep looking */ }
  }

  // Tier 2: full stripped page text — usually the most complete option.
  const clone = doc.cloneNode(true);
  Array.from(clone.querySelectorAll("script, style, noscript")).forEach(function (el) { el.remove(); });
  const bodyText = (clone.body ? clone.body.textContent : "").replace(/\s+/g, " ").trim();
  if (bodyText.length > 200) {
    return { description: bodyText.slice(0, 8000), title: doc.title || "", company: "" };
  }

  // Tier 3: meta tags — last resort for JS-rendered pages with little raw HTML.
  const ogTitle = doc.querySelector('meta[property="og:title"]');
  const ogDesc = doc.querySelector('meta[property="og:description"]') || doc.querySelector('meta[name="description"]');
  const ogSite = doc.querySelector('meta[property="og:site_name"]');
  if (ogDesc && ogDesc.content && ogDesc.content.trim().length > 40) {
    return {
      description: ogDesc.content.trim(),
      title: ogTitle ? ogTitle.content : (doc.title || ""),
      company: ogSite ? ogSite.content : "",
    };
  }

  throw new Error("empty page");
}

function buildResumeText(rec) {

    lines.push("");

  lines.push("CORE COMPETENCIES");

  lines.push("");

  lines.push("SOFTWARE & TOOLS");

  lines.push("");

function handleDownloadCover(id) {

  downloadDoc(filename, "Cover Letter", buildCoverLetterDocHTML(rec));
}

function groupKeyFor(a, mode) {
  if (mode === "company") return a.company || "Unknown company";
  if (mode === "role") return a.jobTitle || "Untitled role";
  return null;
}

function buildGroups(list, mode) {
  if (mode === "none") return [{ key: null, items: list }];
  const map = new Map();
  list.forEach(function (a) {
    const k = groupKeyFor(a, mode);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(a);
  });
  return Array.from(map.entries()).map(function (entry) { return { key: entry[0], items: entry[1] }; });
}

function chipHTML(text, tone, sm) {
  const cls = tone === "match" ? "cal-chip-match" : tone === "gap" ? "cal-chip-gap" : "cal-chip-neutral";
  return '<span class="cal-chip ' + cls + (sm ? " cal-chip-sm" : "") + '">' + esc(text) + "</span>";
}

function circularGaugeHTML(label, value, caption) {
  const r = 36, cx = 44, cy = 44;
  const circumference = 2 * Math.PI * r;
  const pct = value != null ? Math.max(0, Math.min(100, value)) : 0;
  const offset = circumference * (1 - pct / 100);
  const color = scoreColor(value);
  return '<div class="cal-gauge">' +
    '<svg width="88" height="88" viewBox="0 0 88 88">' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#E6E6F2" stroke-width="9"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + circumference.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '" transform="rotate(-90 ' + cx + " " + cy + ')"/>' +
    '<text x="' + cx + '" y="' + (cy + 6) + '" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="600" fill="#16161F">' + (value != null ? value + "%" : "—") + "</text>" +
    "</svg>" +
    '<div class="cal-gauge-label">' + esc(label) + "</div>" +
    (caption ? '<div class="cal-gauge-caption">' + esc(caption) + "</div>" : "") +
    "</div>";
}

async function saveMasterTemplate() {
  ensureTemplateDraft();
  if (!state.templateDraft.sourceFileName || !/\.docx$/i.test(state.templateDraft.sourceFileName)) {
    state.templateError = "Upload a .docx Master Template first.";
    render();
    return;
  }
  MASTER_TEMPLATE = Object.assign({}, DEFAULT_TEMPLATE_PROFILE, state.templateDraft);
  try { await window.storage.set(MASTER_TEMPLATE_KEY, JSON.stringify(MASTER_TEMPLATE)); } catch(e) {}
  state.templateDraft = Object.assign({}, MASTER_TEMPLATE);
  state.templateSavedNotice = true;
  state.templateError = null;
  state.templateNotice = "This DOCX is now the locked-format base for generated resumes.";
  addCurrentTemplateToLibrary();
  render();
}
function resetMasterTemplate() {
  MASTER_TEMPLATE = Object.assign({}, DEFAULT_TEMPLATE_PROFILE);
  state.templateDraft = Object.assign({}, MASTER_TEMPLATE);
  state.templateSavedNotice = false;
  state.templateError = null;
  state.templateNotice = "";
  window.storage.set(MASTER_TEMPLATE_KEY, JSON.stringify(MASTER_TEMPLATE));
  render();
}
function removeMasterTemplateFile() {
  ensureTemplateDraft();
  state.templateDraft.sourceFileName = "";
  state.templateDraft.sourceFileType = "";
  state.templateDraft.sourceFileSize = 0;
  state.templateDraft.placeholderCount = null;
  state.templateDraft.sourceMatches = null;
  state.templateSavedNotice = false;
  state.templateNotice = "";
  render();
}
async function handleMasterTemplateUpload(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if (ext !== "docx") {
    state.templateError = "Exact format preservation requires a Microsoft Word .docx file. Legacy .doc templates are not supported.";
    state.templateNotice = "";
    render();
    return;
  }

  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const inspection = await inspectDocxTemplate(bytes);

    ensureTemplateDraft();
    const oldId = state.templateDraft.id;
    const newId = "tpl-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,6);
    state.templateDraft.sourceFileName = file.name;
    state.templateDraft.sourceFileType = file.type || "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
    state.templateDraft.sourceFileSize = file.size || 0;
    state.templateDraft.name = file.name.replace(/\.docx$/i, "");
    state.templateDraft.id = newId;
    state.templateDraft.placeholderCount = inspection.placeholderCount;
    state.templateDraft.sourceMatches = inspection.sourceMatches;

    await putTemplateBytes(newId, bytes);
    if (oldId && oldId !== newId && !(state.templateLibrary || []).some(function(x){ return x.id === oldId; })) {
      await deleteTemplateBytes(oldId);
    }

    state.templateSavedNotice = false;
    state.templateError = null;
    if (inspection.placeholderCount || inspection.sourceMatches) {
      state.templateNotice = "Template ready. Content anchors were detected; output will preserve the original DOCX formatting.";
    } else {
      state.templateNotice = "Template saved, but no placeholders or matching Master Resume text were detected. Add placeholders such as {{SUMMARY}} and {{EXP_1_BULLET_1}}, or use a DOCX that already contains your Master Resume text.";
    }
    render();
  } catch (e) {
    state.templateError = "Could not read this DOCX: " + (e && e.message ? e.message : "unknown error");
    state.templateNotice = "";
    render();
  }
}

/* ---------------------------------------------------------------
   Render: Report tab
---------------------------------------------------------------- */
function reportHTML() {
  const apps = state.applications;
  const total = apps.length;
  if (total === 0) {
    return emptyStateHTML("Nothing to report yet — add a few applications from the Tailor tab first.");
  }
  const byStatus = STATUSES.map(function (s) { return { status: s, count: apps.filter(function (a) { return a.status === s; }).length }; });
  const responded = apps.filter(function (a) { return a.status !== "Applied"; }).length;
  const callbacks = apps.filter(function (a) { return a.status === "Interview" || a.status === "Offer"; }).length;
  function finalAts(a) { return a.finalAtsScore != null ? a.finalAtsScore : a.atsScore; }
  function finalProb(a) { return a.finalSelectionProbability != null ? a.finalSelectionProbability : a.selectionProbability; }
  const atsScored = apps.filter(function (a) { return typeof finalAts(a) === "number"; });
  const probScored = apps.filter(function (a) { return typeof finalProb(a) === "number"; });
  const avgAts = atsScored.length ? Math.round(atsScored.reduce(function (s, a) { return s + finalAts(a); }, 0) / atsScored.length) : null;
  const avgProb = probScored.length ? Math.round(probScored.reduce(function (s, a) { return s + finalProb(a); }, 0) / probScored.length) : null;
  const responseRate = Math.round((responded / total) * 100);
  const callbackRate = Math.round((callbacks / total) * 100);

  const gapCounts = {};
  apps.forEach(function (a) {
    (a.missingKeywords || []).forEach(function (k) {
      const key = k.trim().toLowerCase();
      if (!key) return;
      gapCounts[key] = gapCounts[key] || { label: k, count: 0 };
      gapCounts[key].count += 1;
    });
  });
  const topGaps = Object.values(gapCounts).sort(function (a, b) { return b.count - a.count; }).slice(0, 8);

  function breakdown(mode) {
    return buildGroups(apps, mode).map(function (g) {
      return {
        key: g.key, count: g.items.length,
        interview: g.items.filter(function (a) { return a.status === "Interview"; }).length,
        offer: g.items.filter(function (a) { return a.status === "Offer"; }).length,
      };
    }).sort(function (a, b) { return b.count - a.count; });
  }
  const byCompany = breakdown("company");
  const byRole = breakdown("role");

  const maxCount = Math.max.apply(null, [1].concat(byStatus.map(function (s) { return s.count; })));
  const barsHTML = byStatus.map(function (s) {
    const h = Math.max(4, Math.round((s.count / maxCount) * 120));
    return '<div class="cal-bar-col"><div class="cal-bar-count">' + s.count + '</div><div class="cal-bar" style="height:' + h + "px; background:" + STATUS_COLOR[s.status] + ';"></div><div class="cal-bar-label">' + s.status + "</div></div>";
  }).join("");

  const statCards = [
    { label: "Applications logged", value: total },
    { label: "Response rate", value: responseRate + "%" },
    { label: "Callback rate", value: callbackRate + "%" },
    { label: "Avg. ATS match", value: avgAts != null ? avgAts + "%" : "—" },
    { label: "Avg. selection prob.", value: avgProb != null ? avgProb + "%" : "—" },
  ].map(function (s) { return '<div class="cal-statcard"><div class="cal-statvalue">' + s.value + '</div><div class="cal-statlabel">' + esc(s.label) + "</div></div>"; }).join("");

  const companyRows = byCompany.map(function (row) {
    return '<div class="cal-breakrow"><span>' + esc(row.key) + '</span><span class="cal-muted">' + row.count + " applied · " + row.interview + " interview · " + row.offer + " offer</span></div>";
  }).join("");
  const roleRows = byRole.map(function (row) {
    return '<div class="cal-breakrow"><span>' + esc(row.key) + '</span><span class="cal-muted">' + row.count + " applied · " + row.interview + " interview · " + row.offer + " offer</span></div>";
  }).join("");

  const gapsHTML = topGaps.length ?
    '<div><div class="cal-label2">Most common skill gaps across your applications</div><div class="cal-panel" style="padding:8px;">' +
    topGaps.map(function (g) {
      return '<div class="cal-gaprow"><div class="cal-gaplabel">' + esc(g.label) + '</div><div class="cal-gapbar-bg"><div class="cal-gapbar-fg" style="width:' + ((g.count / total) * 100) + '%;"></div></div><div class="cal-gapcount">' + g.count + " of " + total + "</div></div>";
    }).join("") + "</div></div>" : "";

  return '<div class="cal-statgrid">' + statCards + "</div>" +
    '<div class="cal-label2">Applications by outcome</div>' +
    '<div class="cal-panel cal-barchart">' + barsHTML + "</div>" +
    '<div class="cal-grid2" style="margin-bottom:28px;">' +
    '<div><div class="cal-label2">By company</div><div class="cal-panel" style="padding:8px;">' + companyRows + "</div></div>" +
    '<div><div class="cal-label2">By role</div><div class="cal-panel" style="padding:8px;">' + roleRows + "</div></div>" +
    "</div>" + gapsHTML;
}

}

function updateStatus(id, status) {
  persist(state.applications.map(function (a) { return a.id === id ? Object.assign({}, a, { status: status }) : a; }));
}

function deleteApp(id) {
  state.confirmDeleteId = null;
  persist(state.applications.filter(function (a) { return a.id !== id; }));
}

function clearAllApplications() {
  state.confirmClearAll = false;
  persist([]);
}

function useAsTemplate(id) {
  const a = state.applications.find(function (x) { return x.id === id; });
  if (!a) return;
  state.rawInput = "Company: " + a.company + "\nRole: " + a.jobTitle + "\nLocation: " + (a.location || "") + "\n\n";
  state.jobUrl = "";
  state.result = null;
  state.editCompany = ""; state.editTitle = ""; state.editLocation = ""; state.editContact = "";
  state.tab = "tailor";
  render();
}

function clearTailor() {
  state.rawInput = ""; state.jobUrl = ""; state.urlError = null; state.urlNotice = null;
  state.result = null; state.confirmedSkills = []; state.confirmedGaps = []; state.logged = false; state.error = null;
  state.editCompany = ""; state.editTitle = ""; state.editLocation = ""; state.editContact = "";
  render();
}

function toggleSkill(skill) {
  const i = state.confirmedSkills.indexOf(skill);
  if (i === -1) {
    state.confirmedSkills.push(skill);
    addIntel("skills", skill); persistProfileIntel();
  } else state.confirmedSkills.splice(i, 1);
  render();
}

async function doCopy(flag) {
  const text = copyRegistry[flag] || "";
  try {
    await navigator.clipboard.writeText(text);
    state.copiedFlag = flag;
    render();
    setTimeout(function () {
      if (state.copiedFlag === flag) { state.copiedFlag = null; render(); }
    }, 2000);
  } catch (e) {
    state.error = "Could not copy — select and copy the text manually.";
    render();
  }
}

async function handleFetchUrl() {
  const url = (state.jobUrl || "").trim();
  if (!url) return;
  state.fetchingUrl = true; state.urlError = null; state.urlNotice = null;
  render();
  try {
    const extracted = await fetchJobFromUrl(url);
    let header = "";
    if (extracted.title) header += "Job title: " + extracted.title + "\n";
    if (extracted.company) header += "Company: " + extracted.company + "\n";
    state.rawInput = (header ? header + "\n" : "") + extracted.description + (state.rawInput ? "\n\n" + state.rawInput : "");
    state.urlNotice = "Pulled text from that page into the box below — skim it before hitting Go.";
  } catch (e) {
    state.urlError = "Could not pull that page automatically — most job boards block this. Paste the text above instead.";
  } finally {
    state.fetchingUrl = false;
    render();
  }
}

async function runCalibration() {
  if (!state.rawInput.trim()) {
    state.error = "Paste the job posting text first.";
    render();
    return;
  }

  state.loading = true;
  state.error = null;
  state.aiStatus = "";
  state.result = null;
  state.confirmedSkills = [];
  state.confirmedGaps = [];
  state.logged = false;
  render();

  try {
    const localBase = await calibrate(state.rawInput, false);
    let r = localBase;

    if (state.useClaude && String(state.claudeApiKey || "").trim()) {
      state.aiStatus = "Claude is generating tailored content…";
      render();
      try {
        r = await generateWithClaude(state.rawInput, localBase);
        state.analysisMode = "claude";
        state.aiStatus = "Claude content generated. Master Template formatting stayed locked.";
      } catch (aiErr) {
        state.analysisMode = "local";
        state.aiStatus = "Claude was unavailable, so the local analysis was kept.";
        state.error = "Claude could not generate content: " + (aiErr && aiErr.message ? aiErr.message : "unknown error");
      }
    } else if (state.useClaude) {
      state.analysisMode = "local";
      state.aiStatus = "Enter a Claude API key to generate the final tailored wording with AI.";
    } else {
      state.analysisMode = "local";
      state.aiStatus = "Local analysis only.";
    }

    state.result = r;
    state.editCompany = r.extracted.company || "";
    state.editTitle = r.extracted.jobTitle || "";
    state.editLocation = r.extracted.location || "";
    state.editContact = r.extracted.contactInfo || "";
  } catch (e) {
    state.error = "Analysis could not complete. Your saved resume and templates are unchanged. " + (e && e.message ? e.message : "Please check the pasted job text.");
  } finally {
    state.loading = false;
    render();
  }
}

async function addToTable() {
  const r = state.result;
  if (state.editCompany) addIntel("companies", state.editCompany);
  if (state.editTitle) addIntel("jobTitles", state.editTitle);
  if (state.editLocation) addIntel("locations", state.editLocation);
  if (r && r.matchedKeywords) addIntel("keywords", r.matchedKeywords);
  if (state.confirmedSkills && state.confirmedSkills.length) addIntel("skills", state.confirmedSkills);
  addIntel("salaries", extractSalaryPatterns(state.rawInput));
  await persistProfileIntel();
  const entry = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
    date: new Date().toISOString(),
    company: state.editCompany || "Unknown company",
    jobTitle: state.editTitle || "Untitled role",
    location: state.editLocation,
    contactInfo: state.editContact,
    jobUrl: state.jobUrl,
    atsScore: r ? r.atsScore : null,
    selectionProbability: r ? r.selectionProbability : null,
    initialAtsScore: r ? r.atsScore : null,
    initialSelectionProbability: r ? r.selectionProbability : null,
    finalAtsScore: r ? adjustedAts(r) : null,
    finalSelectionProbability: r ? adjustedProb(r) : null,
    matchedKeywords: r ? r.matchedKeywords : [],
    missingKeywords: r ? r.missingKeywords : [],
    confirmedGaps: state.confirmedGaps.slice(),
    confirmedSkills: state.confirmedSkills.slice(),
    bulletEdits: r ? r.bulletEdits : [],
    tailoredSummary: r ? r.tailoredSummary : "",
    coverLetter: r ? r.coverLetter : "",
    recommendations: r ? r.recommendations : [],
    tip: r ? r.tip : "",
    status: "Applied",
  };
  await persist([entry].concat(state.applications));
  state.logged = true;
  render();
}

/* ---------------------------------------------------------------
   Event delegation
---------------------------------------------------------------- */
function onRootClick(e) {
  const actionEl = e.target.closest("[data-action]");
  if (!actionEl) return;
  const action = actionEl.dataset.action;
  if (action === "toggleExpand" && e.target.closest("td[data-stop]")) return;

  switch (action) {
    case "tab":
      state.tab = actionEl.dataset.tab;
      render();
      break;
    case "fetchUrl":
      handleFetchUrl();
      break;
    case "runCalibration":
      runCalibration();
      break;
    case "clearTailor":
      clearTailor();
      break;
    case "copy":
      doCopy(actionEl.dataset.flag);
      break;
    case "downloadResume":
      handleDownloadResume(actionEl.dataset.id);
      break;
    case "downloadCover":
      handleDownloadCover(actionEl.dataset.id);
      break;
    case "downloadBundle":
      handleDownloadBundle(actionEl.dataset.id);
      break;
    case "addToTable":
      addToTable();
      break;
    case "toggleExpand":
      state.expandedId = state.expandedId === actionEl.dataset.id ? null : actionEl.dataset.id;
      render();
      break;
    case "useTemplate":
      useAsTemplate(actionEl.dataset.id);
      break;
    case "confirmDelete":
      state.confirmDeleteId = actionEl.dataset.id;
      render();
      break;
    case "deleteApp":
      deleteApp(actionEl.dataset.id);
      break;
    case "clearAllAsk":
      state.confirmClearAll = true;
      render();
      break;
    case "clearAllConfirm":
      clearAllApplications();
      break;
    case "saveResume":
      saveResume();
      break;
    case "discardResumeDraft":
      discardResumeDraft();
      break;
    case "restoreDefaultResumeAsk":
      state.resumeResetAsk = true;
      render();
      break;
    case "restoreDefaultResumeConfirm":
      restoreDefaultResumeDraft();
      break;
    case "addExperienceBlock":
      addExperienceBlock();
      break;
    case "removeExperienceBlock":
      removeExperienceBlock(parseInt(actionEl.dataset.idx, 10));
      break;
    case "removeDraftPhoto":
      removeDraftPhoto();
      break;
    case "saveMasterTemplate":
      saveMasterTemplate();
      break;
    case "resetMasterTemplate":
      resetMasterTemplate();
      break;
    case "removeMasterTemplateFile":
      removeMasterTemplateFile();
      break;
    case "selectSavedTemplate":
      selectSavedTemplate(actionEl.dataset.id);
      break;
    case "deleteSavedTemplate":
      deleteSavedTemplate(actionEl.dataset.id);
      break;
    case "removeProfileItem":
      removeProfileItem(actionEl.dataset.kind, actionEl.dataset.value);
      break;
    case "addManualSkill":
      addManualSkill();
      break;
    case "notGap":
      markNotGap(actionEl.dataset.value);
      break;
    default:
      break;
  }
}

function onRootInput(e) {
  const bind = e.target && e.target.dataset ? e.target.dataset.bind : null;
  if (!bind) return;
  if (bind.indexOf(".") === -1) {
    state[bind] = e.target.value;
  } else {
    setPath(state, bind, e.target.value);
  }
}

function onRootKeydown(e) {
  const el = e.target;
  if (e.key === "Enter" && el && el.dataset && el.dataset.bind === "manualSkillInput") {
    e.preventDefault();
    addManualSkill();
  }
}

function onRootChange(e) {
  const el = e.target;
  if (el.matches('select[data-action="updateStatus"]')) {
    updateStatus(el.dataset.id, el.value);
  } else if (el.matches('select[data-action="groupBy"]')) {
    state.groupBy = el.value;
    render();
  } else if (el.matches('input[type="checkbox"][data-action="toggleSkill"]')) {
    toggleSkill(el.dataset.skill);
  } else if (el.matches('input[type="checkbox"][data-action="toggleGap"]')) {
    toggleGap(el.dataset.skill);
  } else if (el.matches('input[type="checkbox"][data-action="toggleResearch"]')) {
    state.useResearch = el.checked;
  } else if (el.matches('input[type="file"][data-action="uploadPhoto"]')) {
    handlePhotoUpload(el);
  } else if (el.matches('input[type="file"][data-action="uploadMasterTemplate"]')) {
    handleMasterTemplateUpload(el);
  } else if (el.matches('input[type="checkbox"][data-action="toggleClaude"]')) {
    state.useClaude = el.checked;
    state.aiStatus = el.checked ? "Claude enabled." : "Claude disabled; local analysis will be used.";
    render();
  }
}

/* ---------------------------------------------------------------
   Init
---------------------------------------------------------------- */
const root = document.getElementById("app");
root.addEventListener("click", onRootClick);
root.addEventListener("input", onRootInput);
root.addEventListener("change", onRootChange);
root.addEventListener("keydown", onRootKeydown);
render();

(async function init() {
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    state.applications = res ? JSON.parse(res.value) : [];
  } catch (e) {
    state.applications = [];
  } finally {
    state.appsLoaded = true;
    render();
  }
})();

(async function initResume() {
  try {
    const res = await window.storage.get(MASTER_RESUME_KEY, false);
    if (res && res.value) {
      const saved = JSON.parse(res.value);
      RESUME = Object.assign(defaultResume(), saved);
      state.resumeDraft = null;
      render();
    }
  } catch (e) { /* keep the built-in default */ }
})();

(async function initTemplate() {
  try {
    const res = await window.storage.get(MASTER_TEMPLATE_KEY);
    if (res && res.value) MASTER_TEMPLATE = Object.assign({}, DEFAULT_TEMPLATE_PROFILE, JSON.parse(res.value));
  } catch (e) { MASTER_TEMPLATE = Object.assign({}, DEFAULT_TEMPLATE_PROFILE); }
  state.templateDraft = null;
  render();
})();

(async function initTemplateLibrary() {
  try { const res = await window.storage.get(TEMPLATE_LIBRARY_KEY, false); state.templateLibrary = res && res.value ? JSON.parse(res.value) : []; } catch(e) { state.templateLibrary = []; }
  render();
})();

(async function initProfileKeywords() {
  let loaded=null;
  try { const res = await window.storage.get(PROFILE_INTELLIGENCE_KEY, false); loaded = res && res.value ? JSON.parse(res.value) : null; } catch(e) {}
  if (loaded && typeof loaded === "object") state.profileIntel = loaded;
  else {
    try { const old = await window.storage.get(PROFILE_KEYWORDS_KEY, false); state.profileIntel.keywords = old && old.value ? JSON.parse(old.value) : []; } catch(e) {}
  }
  ensureProfileIntel();
  const seed = (RESUME.competencies || []).concat((RESUME.skills || '').split(/·|,|\n/)).map(function(x){return String(x).trim();}).filter(Boolean);
  addIntel("skills", seed);
  state.profileLoaded = true;
  await persistProfileIntel();
  render();
})();;
</script>
